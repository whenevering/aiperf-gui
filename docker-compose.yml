services:
  aiperf-gui:
    build:
      context: .
      dockerfile: Dockerfile
    image: aiperf-gui:0.1.0
    container_name: aiperf-gui
    ports:
      - "8080:8080"
    volumes:
      - aiperf-results:/data/results
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    restart: unless-stopped

volumes:
  aiperf-results:
