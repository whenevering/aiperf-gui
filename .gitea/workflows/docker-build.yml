name: build-aiperf-gui

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: registry.intra.local
  IMAGE_NAMESPACE: ai
  IMAGE_NAME: aiperf-gui
  AIPERF_BASE_IMAGE: registry.intra.local/ai/aiperf:0.12.0

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        shell: bash
        run: |
          set -euo pipefail
          short_sha="$(git rev-parse --short HEAD)"
          docker build \
            --build-arg AIPERF_BASE_IMAGE="${AIPERF_BASE_IMAGE}" \
            -t "${REGISTRY}/${IMAGE_NAMESPACE}/${IMAGE_NAME}:${short_sha}" \
            -t "${REGISTRY}/${IMAGE_NAMESPACE}/${IMAGE_NAME}:latest" \
            .

      - name: Push image
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${REGISTRY_USER:-}" ] && [ -n "${REGISTRY_PASSWORD:-}" ]; then
            printf '%s' "${REGISTRY_PASSWORD}" | docker login "${REGISTRY}" -u "${REGISTRY_USER}" --password-stdin
          fi
          short_sha="$(git rev-parse --short HEAD)"
          docker push "${REGISTRY}/${IMAGE_NAMESPACE}/${IMAGE_NAME}:${short_sha}"
          docker push "${REGISTRY}/${IMAGE_NAMESPACE}/${IMAGE_NAME}:latest"
