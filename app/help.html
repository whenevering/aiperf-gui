<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AIPerf GUI Help</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Arial, "Microsoft YaHei", sans-serif;
      background: #f5f6f8;
      color: #20242c;
    }
    * { box-sizing: border-box; }
    body { margin: 0; }
    header {
      background: #ffffff;
      border-bottom: 1px solid #dfe3ea;
    }
    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      max-width: 1500px;
      margin: 0 auto;
      padding: 14px 28px;
    }
    h1 {
      margin: 0;
      font-size: 24px;
      line-height: 1.25;
    }
    .top-tools {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-left: auto;
    }
    label {
      display: block;
      margin: 0;
      color: #405066;
      font-size: 14px;
      font-weight: 700;
      white-space: nowrap;
    }
    select {
      height: 38px;
      min-width: 132px;
      border: 1px solid #c8d0dc;
      border-radius: 6px;
      padding: 7px 9px;
      background: #ffffff;
      font: inherit;
    }
    button {
      appearance: none;
      border: 0;
      border-radius: 6px;
      background: #44546a;
      color: #ffffff;
      font: inherit;
      font-weight: 700;
      height: 38px;
      padding: 0 14px;
      cursor: pointer;
      white-space: nowrap;
    }
    main {
      display: grid;
      gap: 14px;
      max-width: 1500px;
      margin: 0 auto;
      padding: 14px;
    }
    section {
      background: #ffffff;
      border: 1px solid #dfe3ea;
      border-radius: 8px;
      padding: 18px;
    }
    h2 {
      margin: 0 0 14px;
      font-size: 20px;
      line-height: 1.25;
    }
    .help-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }
    .help-item {
      border: 1px solid #dfe3ea;
      border-radius: 8px;
      background: #fbfcfe;
      padding: 13px;
    }
    .help-item strong {
      display: block;
      margin-bottom: 6px;
      color: #172033;
      font-size: 15px;
    }
    .help-item p {
      margin: 0;
      color: #405066;
      font-size: 15px;
      line-height: 1.5;
    }
    .help-item small {
      display: block;
      margin-top: 8px;
      color: #6b778c;
      font-size: 14px;
      line-height: 1.4;
    }
    .copyright-line {
      color: #596579;
      font-size: 13px;
      line-height: 1.45;
      text-align: center;
    }
    @media (max-width: 760px) {
      .header-inner {
        align-items: flex-start;
        flex-direction: column;
        padding: 14px;
      }
      .top-tools {
        width: 100%;
        flex-wrap: wrap;
        margin-left: 0;
      }
      .help-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <h1 id="pageTitle">使用帮助</h1>
      <div class="top-tools">
        <label for="languageSelect" id="languageLabel">语言</label>
        <select id="languageSelect">
          <option value="zh">中文</option>
          <option value="en">English</option>
          <option value="fr">Francais</option>
          <option value="de">Deutsch</option>
          <option value="es">Espanol</option>
        </select>
        <button id="homeBtn" type="button">返回主页</button>
      </div>
    </div>
  </header>
  <main>
    <section>
      <h2 id="helpTitle">使用帮助</h2>
      <div class="help-grid" id="helpGrid"></div>
    </section>
    <footer class="copyright-line">(C)Copyright BlueSkyGPT 2026.08. All rights reserved.</footer>
  </main>

          ["Sans proxy", "Adresses qui contournent le proxy, separees par des virgules.", "Exemples : 127.0.0.1,localhost ; 192.168.1.0/24 ; *.local"],

      de: {
        title: "Hilfe",
        language: "Sprache",
        home: "Zur Startseite",
        items: [

    const $ = (id) => document.getElementById(id);
    let currentLang = localStorage.getItem("aiperfGuiLang") || "zh";

    function render() {
      const pack = HELP[currentLang] || HELP.zh;
      document.documentElement.lang = currentLang === "zh" ? "zh-CN" : currentLang;
      document.title = `AIPerf GUI - ${pack.title}`;
      $("pageTitle").textContent = pack.title;
      $("helpTitle").textContent = pack.title;
      $("languageLabel").textContent = pack.language;
      $("homeBtn").textContent = pack.home;
      $("languageSelect").value = currentLang;
      $("helpGrid").innerHTML = pack.items.map(([name, desc, examples]) => `
        <div class="help-item">
          <strong>${name}</strong>
          <p>${desc}</p>
          <small>${examples}</small>
        </div>
      `).join("");
    }

    $("languageSelect").addEventListener("change", (event) => {
      currentLang = event.target.value;
      localStorage.setItem("aiperfGuiLang", currentLang);
      render();
    });
    $("homeBtn").addEventListener("click", () => {
      window.location.href = "/";
    });

    render();
  </script>
</body>
</html>
